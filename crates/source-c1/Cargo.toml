[package]
name = "source-c1"
description = "Capture One catalog as a PhotoSource"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
c1model.workspace = true
chrono.workspace = true
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
serde_json.workspace = true
xxhash-rust.workspace = true

[target.'cfg(windows)'.dependencies]
# Which programs hold the catalog open, the app's own reads left out.
windows-sys = { version = "0.61", features = ["Win32_System_RestartManager"] }

[dev-dependencies]
tempfile.workspace = true
