[package]
name = "c1studio"
description = "C1 Studio: a fast browser for Capture One catalogs"
version.workspace = true
edition.workspace = true
license.workspace = true

# A distinct library name: on Windows a lib and a bin of the same name collide on .pdb files.
[lib]
name = "c1studio_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
c1model.workspace = true
c1geo.workspace = true
c1sources.workspace = true
source-folders.workspace = true
c1index.workspace = true
c1analysis.workspace = true
c1image.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile.workspace = true
