name: Release

# Push a tag `vX.Y.Z` matching the version in app/src-tauri/tauri.conf.json: this builds
# the Windows installer and the Linux packages and attaches them to a draft GitHub
# Release to review and publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match tauri.conf.json version $version"
          }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: UI dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: C1 Studio ${{ github.ref_name }}
          releaseBody: |
            **Windows:** download `C1.Studio_*_x64-setup.exe` below and run it. Windows may warn that the
            installer is from an unknown publisher (it is not code-signed): choose
            *More info* → *Run anyway*.

            **Linux (Ubuntu 22.04 or newer, WSL included):** `sudo apt install ./C1.Studio_*_amd64.deb`,
            or make `C1.Studio_*_amd64.AppImage` executable and run it.

            See the [user guide](https://github.com/bartoszm/c1-studio/blob/main/docs/GUIDE.md).
          releaseDraft: true

  # After the installer, so it adds to the draft that job made rather than racing it.
  linux:
    needs: installer
    # The oldest supported Ubuntu: the AppImage runs on systems at least as new as this.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match tauri.conf.json version $version" >&2
            exit 1
          fi

      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: UI dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: pnpm tauri
          args: --bundles deb,appimage
          tagName: ${{ github.ref_name }}
          releaseName: C1 Studio ${{ github.ref_name }}
          releaseDraft: true
